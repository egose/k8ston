# Sensitive values — replace placeholders before applying.
# kubectl create secret generic k8ston-oidc -n k8ston \
#   --from-literal=OIDC_CLIENT_SECRET='...' \
#   --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: k8ston-oidc
  namespace: k8ston
  labels:
    app.kubernetes.io/name: k8ston
stringData:
  OIDC_CLIENT_SECRET: CHANGE-ME
  SESSION_SECRET: CHANGE-ME-min-32-chars________________________________
