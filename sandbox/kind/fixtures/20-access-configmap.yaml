# Namespace-level access fallback. Lives in the app's own namespace
# (K8STON_NAMESPACE=k8ston-test in sandbox mode); per-secret annotations
# override these rules. k8ston-test is deliberately absent (open by default).
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8ston-access
  namespace: k8ston-test
  labels:
    app.kubernetes.io/part-of: k8ston-sandbox
data:
  access.json: |
    {
      "frontend-ns": {
        "groups": ["frontend-team"],
        "users": []
      }
    }
