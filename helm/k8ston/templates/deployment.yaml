{{- $deploymentTag := .Values.image.tag | default .Chart.AppVersion -}}
{{- $global := .Values.global | default dict -}}
{{- $envSecretName := .Values.envSecretName | default "" -}}
{{- $serviceAccountName := .Values.serviceAccountName | default ($global.serviceAccountName | default (include "k8ston.serviceAccountName" .)) -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8ston.fullname" . }}
  labels:
    {{- include "k8ston.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "k8ston.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $podAnnotations := merge (.Values.podAnnotations | default dict) ($global.podAnnotations | default dict) -}}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "k8ston.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- $imagePullSecrets := concat (.Values.imagePullSecrets | default list) ($global.imagePullSecrets | default list) -}}
      {{- with $imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ $serviceAccountName }}
      # K8ston authenticates to the Kubernetes API with its own ServiceAccount
      # token, so this must stay true (see serviceAccount.automount).
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ $deploymentTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.args }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- end }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: DEPLOYMENT_TAG
              value: {{ $deploymentTag | quote }}
            - name: HELM_REVISION
              value: {{ .Release.Revision | quote }}
            {{- if .Values.podNamespaceEnv }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
          {{- $cfg := include "k8ston.effectiveConfig" . | fromYaml -}}
          {{- $managed := include "k8ston.managedEnvKeys" . | fromYamlArray -}}
            {{- if $cfg.scope }}
            - name: K8STON_SCOPE
              value: {{ $cfg.scope | quote }}
            {{- end }}
            {{- if $cfg.namespaces }}
            - name: K8STON_NAMESPACES
              value: {{ $cfg.namespaces | quote }}
            {{- end }}
            - name: K8STON_RESTART_ENABLED
              value: {{ $cfg.restartEnabled | quote }}
            {{- if $cfg.accessConfigMap }}
            - name: K8STON_ACCESS_CONFIGMAP
              value: {{ $cfg.accessConfigMap | quote }}
            {{- end }}
            {{- range $k, $v := $cfg.env }}
            {{- if not (has $k $managed) }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $envSecretName }}
          envFrom:
            - secretRef:
                name: {{ $envSecretName }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
