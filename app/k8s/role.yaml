---
# Namespace-scoped permissions (K8STON_SCOPE=namespace, the default).
# K8ston can only manage secrets in its own namespace. Repeat the
# RoleBinding in additional namespaces to grant per-namespace access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8ston
  namespace: k8ston
  labels:
    app.kubernetes.io/name: k8ston
rules:
  # Core state: secrets incl. version snapshots (also Secrets)
- apiGroups: ['']
  resources: [secrets]
  verbs: [get, list, watch, create, update, patch, delete]
  # Namespace-level access rules (k8ston-access ConfigMap)
- apiGroups: ['']
  resources: [configmaps]
  verbs: [get, list, watch]
  # Consumer restart (rollout via pod-template annotation patch) is disabled
  # by default (K8STON_RESTART_ENABLED=false). To enable it, set the flag to
  # 'true' in configmap-app.yaml AND uncomment the rule below:
# - apiGroups: [apps]
#   resources: [deployments, statefulsets, daemonsets]
#   verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8ston
  namespace: k8ston
  labels:
    app.kubernetes.io/name: k8ston
subjects:
- kind: ServiceAccount
  name: k8ston
  namespace: k8ston
roleRef:
  kind: Role
  name: k8ston
  apiGroup: rbac.authorization.k8s.io
