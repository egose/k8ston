---
# Sandbox secret fixtures — one per authorization case (values are fake).
# Expected visibility (see ../README.md matrix):
#   database-credentials  secret-level rules (dev-team)            alice/admin only
#   feature-flags         no rules anywhere (open by default)      everyone
#   legacy-external       unmanaged, no k8ston annotations        everyone + "external" badge
#   frontend-api-keys     no secret rules -> namespace fallback    carol/admin only
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: k8ston-test
  annotations:
    k8ston.io/managed-by: k8ston
    k8ston.io/version: '1'
    k8ston.io/description: Sandbox Postgres credentials (fake)
    k8ston.io/allowed-groups: dev-team, database-admins
  labels:
    app.kubernetes.io/part-of: k8ston-sandbox
type: Opaque
stringData:
  username: sandbox-app
  password: sandbox-password-123
  host: postgres.k8ston-test.svc
---
apiVersion: v1
kind: Secret
metadata:
  name: feature-flags
  namespace: k8ston-test
  annotations:
    k8ston.io/managed-by: k8ston
    k8ston.io/version: '1'
    k8ston.io/description: Non-sensitive flags; open to all authenticated users
  labels:
    app.kubernetes.io/part-of: k8ston-sandbox
type: Opaque
stringData:
  new-checkout: 'true'
  dark-mode: 'false'
---
apiVersion: v1
kind: Secret
metadata:
  name: legacy-external
  namespace: k8ston-test
  labels:
    app.kubernetes.io/part-of: k8ston-sandbox
type: Opaque
stringData:
  token: legacy-token-abc
---
apiVersion: v1
kind: Secret
metadata:
  name: frontend-api-keys
  namespace: frontend-ns
  annotations:
    k8ston.io/managed-by: k8ston
    k8ston.io/version: '1'
    k8ston.io/description: Governed by namespace fallback (no secret-level rules)
  labels:
    app.kubernetes.io/part-of: k8ston-sandbox
type: Opaque
stringData:
  maps-key: fk-sandbox-001
  analytics-key: fk-sandbox-002
