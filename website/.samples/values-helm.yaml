# Minimal Helm values for namespace k8ston (umbrella chart: helm/main).
# Replace the image-version placeholder, URLs, client ID, and group names.
# Secret values (OIDC_CLIENT_SECRET, SESSION_SECRET) belong in a Kubernetes
# Secret referenced by envSecretName — never in values files.
global:
  env: {}

k8ston:
  enabled: true
  replicaCount: 2
  image:
    tag: <published-X.Y.Z-version>
  # Provision this Secret out-of-band; do not put its values in Git or shell history.
  envSecretName: k8ston-oidc
  env:
    AUTH_DISABLED: 'false'
    K8STON_ETCD_ENCRYPTED: 'false' # set 'true' once apiserver encryption is on
    K8STON_ADMIN_GROUPS: k8ston-admin
    OIDC_ISSUER: https://keycloak.example.com/realms/company
    OIDC_CLIENT_ID: k8ston
    OIDC_SCOPES: openid profile email groups
    APP_URL: https://k8ston.example.com
  # Derives the default K8STON_SCOPE (explicit entries must match):
  # namespace (default) or cluster. Curated extras add a derived allowlist.
  rbac:
    create: true
    scope: namespace
  # "Restart apps" (API + UI + apps RBAC rule). Default false.
  restartEnabled: false
  # Namespace fallback rules (k8ston-access / access.json).
  accessConfig:
    enabled: true
    data:
      k8ston:
        groups: [secret-operators]
        users: []

networkPolicy:
  enabled: true
  # MUST be true on OpenShift (routes arrive from openshift-ingress).
  allowOpenShiftIngress: false
