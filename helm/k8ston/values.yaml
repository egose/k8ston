# Default values for k8ston.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # Merged into the container env below `env`; per key, local `env` wins over
  # `global.env`. Entries for chart-managed keys (K8STON_SCOPE,
  # K8STON_NAMESPACES, K8STON_RESTART_ENABLED, K8STON_ACCESS_CONFIGMAP) must
  # match the derived effective config or rendering fails with guidance.
  env: {}
  podAnnotations: {}
  imagePullSecrets: []
  serviceAccountName: ''

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/egose/k8ston
  tag: latest
  pullPolicy: Always

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: k8ston
fullnameOverride: k8ston

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # K8ston talks to the Kubernetes API with its own ServiceAccount token, so
  # the token MUST be auto-mounted (unlike apps that set this to false).
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

serviceAccountName:

# Optional extra CLI args for the container.
args: []

envSecretName: ''
# Non-secret env vars (local `env` wins over `global.env` per key). The chart
# derives K8STON_SCOPE (from rbac.scope), K8STON_NAMESPACES (from
# rbac.extraNamespaces, curated mode only), K8STON_RESTART_ENABLED (from
# restartEnabled), and K8STON_ACCESS_CONFIGMAP (from accessConfig.name when
# enabled); an explicit entry for one of these managed keys must equal the
# derived effective value or rendering fails with guidance. Omit them to use
# the derived defaults. Do not also set managed keys in the envSecretName
# Secret: explicit env entries always shadow envFrom values.
env: {}

# Inject POD_NAMESPACE from the downward API (metadata.namespace). K8ston
# resolves its own namespace as POD_NAMESPACE, then K8STON_NAMESPACE, then
# 'k8ston' (see app/lib/config.ts); namespace scope requires this.
podNamespaceEnv: true

# Additional raw env entries appended after `env` (e.g. valueFrom sources).
# Must not set chart-managed keys (K8STON_SCOPE, K8STON_NAMESPACES,
# K8STON_RESTART_ENABLED, K8STON_ACCESS_CONFIGMAP): extraEnv renders after
# `env` and would shadow the derived effective values, so rendering fails.
extraEnv: []
# - name: POD_IP
#   valueFrom:
#     fieldRef:
#       fieldPath: status.podIP

# "Restart apps" feature: rolling restart of Deployments/StatefulSets/
# DaemonSets consuming a secret. This single effective value drives BOTH the
# K8STON_RESTART_ENABLED runtime env flag AND the `apps` RBAC rule below, so
# the two can never silently disagree. An explicit K8STON_RESTART_ENABLED
# entry in `env`/`global.env` must parse to the same value (runtime truthy
# strings: 1/true/yes/on, e.g. `yes` agrees with `true`) or rendering fails.
# With rbac.create=false, grant the apps permissions out-of-band to match.
# Default false (least privilege): the UI button is hidden and the API returns
# 403. Set true when restarts are not handled externally (e.g.
# Reloader/Stakater or GitOps rollouts).
restartEnabled: false

# Kubernetes RBAC for the app ServiceAccount (see app/k8s/role.yaml and
# app/k8s/clusterrole.yaml). The chart derives the default K8STON_SCOPE from
# `scope` (and a curated K8STON_NAMESPACES allowlist from `extraNamespaces`);
# an explicit K8STON_SCOPE/K8STON_NAMESPACES entry in `env`/`global.env` must
# match the derived value or rendering fails. `namespace` manages secrets in
# its own namespace only, `cluster` is a centralized multi-namespace dashboard
# (optionally narrowed with K8STON_NAMESPACES in `env`). With create=false,
# RBAC is managed out-of-band: set K8STON_SCOPE/K8STON_NAMESPACES in `env`
# yourself to match your external grants (`scope`/`extraNamespaces` are then
# ignored).
rbac:
  create: true
  scope: namespace
  # Extra namespaces for curated multi-namespace access: a Role + RoleBinding
  # pair is rendered per entry (subject stays this release's ServiceAccount)
  # and the chart derives effective K8STON_SCOPE=cluster with
  # K8STON_NAMESPACES="<release-namespace>,<extras...>" — served by these
  # namespaced Roles only, no ClusterRole is rendered. Only used when scope is
  # `namespace` (rendering fails otherwise); entries must be non-empty,
  # comma-free namespace names. Previously these entries granted Roles the
  # namespace runtime scope could not use; remove them to stay single-namespace.
  extraNamespaces: []
  # - team-a

# Namespace-level ownership fallback ConfigMap (see
# app/k8s/configmap-access.yaml). Per-secret annotations override these rules.
# When enabled, the chart renders the ConfigMap AND derives
# K8STON_ACCESS_CONFIGMAP from `name` so the runtime policy reader
# (app/lib/authz.ts) finds it; an explicit K8STON_ACCESS_CONFIGMAP entry must
# match `name` or rendering fails. `key` must stay `access.json` (hardcoded by
# the runtime reader). When disabled, set K8STON_ACCESS_CONFIGMAP in `env` to
# point at an externally managed ConfigMap.
# Namespace groups/users see ALL secrets (every team + unassigned); team
# members see only their team's secrets. Secrets carry k8ston.io/team
# (missing/blank = unassigned, namespace rules only).
accessConfig:
  enabled: false
  name: k8ston-access
  key: access.json
  data: {}
  # data:
  #   production:
  #     groups: [dev-team, database-admins]
  #     users: [alice@company.com]
  #     teams:
  #       - name: team1
  #         groups: [team1-dev]
  #         users: []
  #       - name: team2
  #         groups: []
  #         users: [bob@company.com]

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  # k8ston images run as non-root user 65532 (see /Dockerfile).
  runAsUser: 65532

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  # k8ston's Next.js standalone server listens on 3000 by default; the
  # deployment passes this value as the PORT env var so the two cannot drift.
  port: 3000

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ''
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
  - host: chart-example.local
    paths:
    - path: /
      pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

route:
  enabled: false
  host:

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# /api/config is an unauthenticated endpoint that answers without touching the
# Kubernetes API or OIDC discovery, so it is safe to probe (see app/k8s/deployment.yaml).
livenessProbe:
  httpGet:
    path: /api/config
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /api/config
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
startupProbe: {}

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ''

topologySpreadConstraints: []

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
