# Production example for `helm/main` on Kubernetes/OpenShift:
# Namespace-scoped Krypton with OIDC SSO behind an OpenShift Route.
# Usage (see helm/main/Makefile):
#   cp values-k8s-prod.example.yaml values-<namespace>.secret.yaml  # then fill host/CIDRs
#   make upgrade NAMESPACE=<app-namespace> IMAGE_TAG=<tag>  # or helm directly:
#   helm upgrade --install krypton helm/main -n <app-namespace> \
#     -f helm/main/values.yaml -f helm/main/values-<namespace>.secret.yaml \
#     --set krypton.image.tag=<tag>
# The OIDC/session secrets live in a kubectl-applied Secret
# (app/k8s/secret-oidc.yaml), never in this file. This file only carries
# env-specific non-secret overrides; it is gitignored (*.secret.yaml).
global:
  env: {}

krypton:
  enabled: true
  envSecretName: krypton-oidc
  # Krypton is stateless (Kubernetes Secrets are the datastore), so more than
  # one replica is always safe.
  replicaCount: 2
  image:
    repository: ghcr.io/egose/krypton
    pullPolicy: IfNotPresent
  env:
    KRYPTON_SCOPE: namespace
    KRYPTON_ETCD_ENCRYPTED: 'true' # only once apiserver encryption (aescbc) is on
    KRYPTON_IMPERSONATION: 'false'
    KRYPTON_MANAGED_ONLY: 'true' # hide K8s secrets not created by Krypton
    KRYPTON_ADMIN_GROUPS: krypton-admin
    KRYPTON_ACCESS_CONFIGMAP: krypton-access
    OIDC_ISSUER: https://keycloak.example.com/realms/company
    OIDC_CLIENT_ID: krypton
    OIDC_SCOPES: openid profile email roles
    OIDC_GROUPS_CLAIM: roles
    OIDC_USERNAME_CLAIM: email
    NEXT_PUBLIC_APP_URL: https://krypton.apps.example.com
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: krypton
  route:
    enabled: true
    host: krypton.apps.example.com
  # For a centralized multi-namespace dashboard instead, set rbac.scope to
  # `cluster` below (KRYPTON_SCOPE above may then be dropped — the chart
  # derives it — or set to `cluster`), and optionally narrow with
  # KRYPTON_NAMESPACES="team-a,team-b".
  rbac:
    create: true
    scope: namespace
  # Namespace groups/users see ALL secrets; team members see only their team's
  # secrets (krypton.io/team annotation; unassigned uses namespace rules only).
  accessConfig:
    enabled: true
    data:
      production:
        groups: [dev-team, database-admins]
        users: [alice@company.com]
        teams:
          - name: team1
            groups: [team1-dev]
            users: []
          - name: team2
            groups: []
            users: [bob@company.com]

# Pod DNS egress defaults already cover upstream K8s (kube-system) and
# OpenShift (openshift-dns) — no override needed. allowOpenShiftIngress is
# REQUIRED on OpenShift, otherwise the Route cannot reach the pods.
# Egress for the external IdP (OIDC discovery/token/userinfo over 443): note
# allowKubeApiEgress already permits 443 egress; set it to false for tighter
# rules restricted to the CIDRs below plus extraEgress API server CIDRs.
networkPolicy:
  allowOpenShiftIngress: true
  krypton:
    idpEgressIpBlocks:
    - cidr: 203.0.113.10/32
