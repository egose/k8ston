# See https://helm.sh/docs/chart_template_guide/subcharts_and_globals/#global-chart-values
global:
  # env:            # merged into every subchart container, subchart `env` wins per key
  #   Env: dev
  env: {}
  security:
    allowInsecureImages: false
  serviceAccountName:
  imagePullSecrets: []

nameOverride: ''
fullnameOverride: ''

k8ston:
  enabled: true
  replicaCount: 2
  image:
    pullPolicy: IfNotPresent

  nameOverride: k8ston
  fullnameOverride: ''

  resources:
    requests:
      cpu: 100m         # 0.1 CPU core
      memory: 256Mi      # 256 MB RAM
    limits:
      cpu: 1000m        # 1 CPU core
      memory: 1Gi       # 1 GB RAM

  # k8ston takes no extra CLI args (`node app/server.js` standalone).
  args: []

  # Non-secret k8ston configuration, e.g. K8STON_ADMIN_GROUPS, OIDC_ISSUER,
  # OIDC_CLIENT_ID, OIDC_SCOPES, NEXT_PUBLIC_APP_URL. Secret values
  # (OIDC_CLIENT_SECRET, SESSION_SECRET) belong in a Kubernetes Secret
  # referenced by envSecretName. Full variable reference: app/.env.example.
  # Chart-managed keys (K8STON_SCOPE, K8STON_NAMESPACES,
  # K8STON_RESTART_ENABLED, K8STON_ACCESS_CONFIGMAP) are derived from the
  # rbac/restartEnabled/accessConfig values below — omit them or set the same
  # effective value (mismatches fail rendering with guidance).
  env: {}
  envSecretName: ''

  # RBAC for the app ServiceAccount. The chart derives K8STON_SCOPE from
  # `scope` (and a curated K8STON_NAMESPACES allowlist from
  # `extraNamespaces`): `namespace` (own namespace only, the default) or
  # `cluster` (centralized multi-namespace dashboard, optionally narrowed with
  # K8STON_NAMESPACES in `env`). See helm/k8ston/values.yaml and its README
  # for the full effective-configuration reference.
  rbac:
    create: true
    scope: namespace

  # "Restart apps" feature: the single effective value driving BOTH the
  # K8STON_RESTART_ENABLED runtime flag AND the apps RBAC rule for
  # deployments/statefulsets/daemonsets. Default false (least privilege):
  # the UI button is hidden and the API returns 403. Set true to enable.
  restartEnabled: false

  # Namespace-level ownership fallback ConfigMap (k8ston-access / access.json).
  # Per-secret annotations override these rules (see app/k8s/configmap-access.yaml).
  # Namespace groups/users see all teams; team members see only their team's
  # secrets. When enabled, K8STON_ACCESS_CONFIGMAP is derived from the ConfigMap name.
  accessConfig:
    enabled: false

networkPolicy:
  enabled: true
  allowSameNamespace: false
  # OpenShift Routes reach pods from the openshift-ingress namespace: this
  # MUST be true on OpenShift or all ingress is denied (see the prod example).
  allowOpenShiftIngress: false
  dns:
    # Pod DNS (UDP/TCP 53). Covers upstream Kubernetes (kube-system: kind,
    # k3d, GKE, EKS, AKS, ...) AND OpenShift (openshift-dns). CoreDNS pod
    # labels differ per distro/install, so all pods in the DNS namespaces
    # are matched — those namespaces only run DNS components.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - kube-system
            - openshift-dns
    podSelector: {}
  k8ston:
    ingressFrom: []
    # K8ston calls the Kubernetes API (https://kubernetes.default.svc), which
    # is a ClusterIP and cannot be selected by podSelector, so this allows TCP
    # egress on the API ports. Override kubeApiPorts / extraEgress when the
    # API server CIDRs are known and tighter rules are wanted.
    allowKubeApiEgress: true
    kubeApiPorts:
    - 443
    - 6443
    # Standard NetworkPolicy cannot match DNS names. Add the CIDR ranges used
    # by your IdP (OIDC discovery/token/userinfo over 443). Note this is only
    # a restriction when allowKubeApiEgress above is false, which already
    # permits 443 egress.
    idpEgressIpBlocks: []
    # - cidr: 203.0.113.10/32
    extraEgress: []
