# Non-sensitive K8ston configuration. Secrets (OIDC client secret,
# session key) go in the k8ston-oidc Secret — see the README.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8ston-config
  namespace: k8ston
  labels:
    app.kubernetes.io/name: k8ston
data:
  K8STON_SCOPE: namespace   # or 'cluster' with clusterrole.yaml applied
  K8STON_NAMESPACES: '' # comma allowlist for cluster scope; empty = all
  K8STON_HISTORY_LIMIT: '20'
  K8STON_MANAGED_ONLY: 'true' # hide secrets without k8ston.io/managed-by=k8ston (excluded from lists, 404 on access)
  K8STON_ETCD_ENCRYPTED: 'false' # set true once apiserver encryption (aescbc) is on
  K8STON_IMPERSONATION: 'false' # true only if the API server trusts the same OIDC issuer
  K8STON_RESTART_ENABLED: 'false' # set true to enable "Restart apps" (button + API); then also uncomment the apps rule in role.yaml
  K8STON_ADMIN_GROUPS: k8ston-admin
  K8STON_ADMIN_USERS: ''
  K8STON_ANNOTATION_PREFIX: k8ston.io
  K8STON_ACCESS_CONFIGMAP: k8ston-access
  OIDC_ISSUER: https://keycloak.example.com/realms/company
  OIDC_ALLOW_HTTP: 'false'
  OIDC_CLIENT_ID: k8ston
  OIDC_SCOPES: openid profile email groups
  OIDC_GROUPS_CLAIM: groups
  OIDC_USERNAME_CLAIM: email
  OIDC_NAME_CLAIM: name
  NEXT_PUBLIC_APP_URL: https://k8ston.example.com
