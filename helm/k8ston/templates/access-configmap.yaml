{{- $_ := include "k8ston.effectiveConfig" . -}}
{{- if .Values.accessConfig.enabled -}}
# Namespace-level ownership fallback for SSO users that have no cluster identity.
# Per-secret annotations (k8ston.io/allowed-groups / allowed-users) override these.
# Namespace groups/users see all teams; team members see only their team's secrets.
# Namespaces absent from this map are open to all authenticated users until restricted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.accessConfig.name }}
  labels:
    {{- include "k8ston.labels" . | nindent 4 }}
data:
  {{ .Values.accessConfig.key }}: |
    {{- toJson .Values.accessConfig.data | nindent 4 }}
{{- end }}
