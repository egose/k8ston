{{- $global := .Values.global | default dict -}}
{{- if and .Values.serviceAccount.create (not .Values.serviceAccountName) (not ($global.serviceAccountName | default "")) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8ston.serviceAccountName" . }}
  labels:
    {{- include "k8ston.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
