# Namespace-level ownership fallback for SSO users that have no cluster identity.
# Per-secret annotations (k8ston.io/allowed-groups / allowed-users) override these.
# Namespace groups/users see ALL secrets; team members see only their team's
# secrets (k8ston.io/team annotation; unassigned uses namespace rules only).
# Namespaces absent from this map are open to all authenticated users until restricted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8ston-access
  namespace: k8ston
  labels:
    app.kubernetes.io/name: k8ston
data:
  access.json: |
    {
      "frontend-ns": {
        "groups": ["AzureAD-Frontend-Team"],
        "users": []
      },
      "production": {
        "groups": ["dev-team", "database-admins"],
        "users": ["alice@company.com"],
        "teams": [
          { "name": "team1", "groups": ["team1-dev"], "users": [] },
          { "name": "team2", "groups": [], "users": ["bob@company.com"] }
        ]
      }
    }
