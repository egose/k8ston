{{- $cfg := include "krypton.effectiveConfig" . | fromYaml -}}
{{- if $cfg.rbacCreate -}}
{{- $global := .Values.global | default dict -}}
{{- $serviceAccountName := .Values.serviceAccountName | default ($global.serviceAccountName | default (include "krypton.serviceAccountName" .)) -}}
{{- $isCluster := eq $cfg.rbacScope "cluster" -}}
{{- if $isCluster }}
# Cluster-wide permissions (effective KRYPTON_SCOPE=cluster) for a centralized
# dashboard managing secrets across namespaces. Narrow with KRYPTON_NAMESPACES
# to allowlist namespaces (see app/k8s/clusterrole.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "krypton.fullname" . }}
  labels:
    {{- include "krypton.labels" . | nindent 4 }}
rules:
- apiGroups: ['']
  resources: [secrets]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: ['']
  resources: [configmaps]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [namespaces]
  verbs: [get, list, watch]
{{- if $cfg.restartEnabled }}
- apiGroups: [apps]
  resources: [deployments, statefulsets, daemonsets]
  verbs: [get, list, watch, patch]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "krypton.fullname" . }}
  labels:
    {{- include "krypton.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ $serviceAccountName }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "krypton.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- else }}
# Namespaced permissions (see app/k8s/role.yaml). Without
# rbac.extraNamespaces the effective runtime scope is KRYPTON_SCOPE=namespace
# (own namespace only, the default). With rbac.extraNamespaces the chart
# renders curated multi-namespace access: effective KRYPTON_SCOPE=cluster with
# a derived KRYPTON_NAMESPACES allowlist (release namespace plus extras),
# served by these namespaced Roles only (no ClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "krypton.fullname" . }}
  labels:
    {{- include "krypton.labels" . | nindent 4 }}
rules:
  # Core state: secrets incl. version snapshots (also Secrets)
- apiGroups: ['']
  resources: [secrets]
  verbs: [get, list, watch, create, update, patch, delete]
  # Namespace-level access rules (krypton-access ConfigMap)
- apiGroups: ['']
  resources: [configmaps]
  verbs: [get, list, watch]
{{- if $cfg.restartEnabled }}
  # Consumer restart (rollout via pod-template annotation patch)
- apiGroups: [apps]
  resources: [deployments, statefulsets, daemonsets]
  verbs: [get, list, watch, patch]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "krypton.fullname" . }}
  labels:
    {{- include "krypton.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ $serviceAccountName }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "krypton.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- range .Values.rbac.extraNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "krypton.fullname" $ }}
  namespace: {{ . }}
  labels:
    {{- include "krypton.labels" $ | nindent 4 }}
rules:
- apiGroups: ['']
  resources: [secrets]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: ['']
  resources: [configmaps]
  verbs: [get, list, watch]
{{- if $.Values.restartEnabled }}
- apiGroups: [apps]
  resources: [deployments, statefulsets, daemonsets]
  verbs: [get, list, watch, patch]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "krypton.fullname" $ }}
  namespace: {{ . }}
  labels:
    {{- include "krypton.labels" $ | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ $serviceAccountName }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "krypton.fullname" $ }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}
